spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sogo
  h2:
    console:
      enabled: true
      path: /h2
  datasource:
    url: jdbc:h2:mem:test
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        default_batch_fetch_size: 500
  server:
    servlet:
      context-path: /
    port: 8080
  jwt:
    secret: ${JWT_SECRET}
    expiration: 360000
    header: Authorization
    refresh-token:
      expiration: 604800000
      header: refresh
  social:
    naverId: ${NAVER_ID}
    naverSecret: ${NAVER_SECRET}
    kakaoId: ${KAKAO_ID}
logging:
  level:
    org:
      springframework:
        orm: debug
openai:
  api:
    key: ${OPENAI_KEY}
  model: ${OPENAI_MODEL}