spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sogo
  datasource:
    url: ${DB_URL}
    username: ${DB_NAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 500
  server:
    servlet:
      context-path: /
    port: 8080
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${ACCESS_EXPIRATION}
    header: Authorization
    refresh-token:
      expiration: ${REFRESH_EXPIRATION}
      header: refresh
  social:
    naverId: ${NAVER_ID}
    naverSecret: ${NAVER_SECRET}
    kakaoId: ${KAKAO_ID}
logging:
  level:
    root: DEBUG
  file:
    name: /home/ubuntu/deploy/app.log
    # 선택 사항: 최대 크기 및 백업 설정
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
openai:
  api:
    key: ${OPENAI_KEY}
  model: ${OPENAI_MODEL}
data:
  openapi:
    key: ${DATA_KEY}
client:
  url: www.so-go.kr

