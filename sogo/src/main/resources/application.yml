spring:
  application:
    name: sogo
  h2:
    console:
      enabled: true
      path: /h2
  datasource:
    url: jdbc:h2:mem:test
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        default_batch_fetch_size: 500
  server:
    servlet:
      context-path: /
  jwt:
    secret: yourSecretKey
    expiration: 360000
    header: Authorization
    refresh-token:
      expiration: 604800000
      header: Authorization-refresh
logging:
  level:
    org:
      springframework:
        orm: debug
